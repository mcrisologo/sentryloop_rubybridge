name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Ruby syntax check
        run: find . -name '*.rb' ! -path './vendor/*' -print0 | xargs -0 -n1 ruby -c
      - name: RSpec
        run: bundle exec rspec
